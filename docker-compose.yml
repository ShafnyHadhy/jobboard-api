version: '3.8'

services:
  # ─── API Backend ───────────────────────────────────────
  api:
    build: .
    container_name: jobboard-api
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:secret@postgres:5432/jobboard
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_key_change_this}

  # ─── PostgreSQL Database ───────────────────────────────
  postgres:
    image: postgres:16
    container_name: jobboard-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: jobboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ─── Redis Cache ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jobboard-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: